<!--
    BilibiliDown Cookie 刷新页面（现代化版）
    复用 /static/css/style.css 与共用 SVG sprite 设计
-->
<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="light dark">
    <title data-i18n="page.cookieRefresh.title">Bilibili Cookie 刷新</title>
    <link href="/static/css/style.css" rel="stylesheet" type="text/css">
</head>

<body>
    <svg xmlns="http://www.w3.org/2000/svg" class="sr-only" aria-hidden="true" focusable="false">
        <symbol id="icon-logo" viewBox="0 0 24 24">
            <path d="M5 4h14a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3zm5 5v6l5-3-5-3z" fill="currentColor"/>
        </symbol>
        <symbol id="icon-sun" viewBox="0 0 24 24">
            <path d="M12 4V2m0 20v-2m8-8h2M2 12h2m13.66-5.66l1.42-1.42M4.92 19.08l1.42-1.42m0-11.32L4.92 4.92m14.16 14.16l-1.42-1.42M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        </symbol>
        <symbol id="icon-moon" viewBox="0 0 24 24">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor"/>
        </symbol>
        <symbol id="icon-auto" viewBox="0 0 24 24">
            <path d="M12 3a9 9 0 1 0 0 18V3z" fill="currentColor"/>
            <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
        </symbol>
        <symbol id="icon-info" viewBox="0 0 24 24">
            <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-1 6h2v2h-2V8zm0 4h2v6h-2v-6z" fill="currentColor"/>
        </symbol>
        <symbol id="icon-error" viewBox="0 0 24 24">
            <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM8.5 7.1L12 10.6l3.5-3.5 1.4 1.4L13.4 12l3.5 3.5-1.4 1.4L12 13.4l-3.5 3.5-1.4-1.4L10.6 12 7.1 8.5l1.4-1.4z" fill="currentColor"/>
        </symbol>
        <symbol id="icon-check" viewBox="0 0 24 24">
            <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-1.4 14.6l-4.2-4.2 1.4-1.4 2.8 2.8 6.2-6.2 1.4 1.4-7.6 7.6z" fill="currentColor"/>
        </symbol>
        <symbol id="icon-warn" viewBox="0 0 24 24">
            <path d="M12 2L1 21h22L12 2zm0 6l7.5 13h-15L12 8zm-1 5h2v4h-2v-4zm0 5h2v2h-2v-2z" fill="currentColor"/>
        </symbol>
        <symbol id="icon-cookie" viewBox="0 0 24 24">
            <path d="M12 2a10 10 0 1 0 10 10c-3 0-5-2-5-5 0-3-2-5-5-5zm-3 6a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm6 5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm-7 3a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z" fill="currentColor"/>
        </symbol>
    </svg>

    <div class="app">
        <header class="topbar">
            <div class="brand">
                <span class="brand__logo" aria-hidden="true"><svg><use href="#icon-logo"/></svg></span>
                <span>BilibiliDown</span>
                <span class="brand__sub" data-i18n="header.subtitle.cookieRefresh">· Cookie 刷新</span>
            </div>

            <div id="theme-switch" class="theme-switch" role="group"
                 data-i18n-attr="aria-label:a11y.themeToggle" aria-label="主题切换">
                <button type="button" class="theme-switch__btn" data-theme-value="light" aria-pressed="false">
                    <svg class="icon"><use href="#icon-sun"/></svg>
                    <span data-i18n="theme.light">浅色</span>
                </button>
                <button type="button" class="theme-switch__btn" data-theme-value="auto" aria-pressed="true">
                    <svg class="icon"><use href="#icon-auto"/></svg>
                    <span data-i18n="theme.auto">自动</span>
                </button>
                <button type="button" class="theme-switch__btn" data-theme-value="dark" aria-pressed="false">
                    <svg class="icon"><use href="#icon-moon"/></svg>
                    <span data-i18n="theme.dark">暗色</span>
                </button>
            </div>
        </header>

        <main class="container" role="main">
            <section class="card" aria-labelledby="card-title">
                <h1 id="card-title" class="card__title">
                    <svg class="icon icon-lg" style="color:var(--brand)"><use href="#icon-cookie"/></svg>
                    <span data-i18n="card.title.cookieRefresh">刷新登录凭据</span>
                </h1>

                <div id="statusbar" class="statusbar statusbar--info" role="status" aria-live="polite">
                    <svg class="statusbar__icon"><use href="#icon-info"/></svg>
                    <span class="statusbar__text" data-i18n="tip.wasm.loading">正在加载 wasm 模块，准备生成 hash…</span>
                </div>

                <div class="actions">
                    <button type="button" id="btn-retry" class="btn" data-i18n="btn.retry" hidden>重试</button>
                    <button type="button" id="btn-close" class="btn" data-i18n="btn.close" hidden>关闭窗口</button>
                </div>
            </section>

            <p class="footer" data-i18n="footer.cookieRefresh">本页面在后台执行后会自动关闭。</p>
        </main>
    </div>

    <script src="https://s1.hdslb.com/bfs/static/jinkela/long/wasm/wasm_ras_umd.js"></script>
    <script type="module" src="/static/js/cookie-refresh.js"></script>
</body>

</html>
