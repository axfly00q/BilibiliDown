<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>历史记录 · BilibiliDown</title>
<link href="/console/css/style.css" rel="stylesheet">
<style>
  .topnav { display:flex; gap:12px; padding:10px 18px; border-bottom:1px solid var(--border); background:var(--surface); }
  .topnav a { text-decoration:none; color:var(--text-muted); font-size:13.5px; }
  .topnav a.active { color:var(--brand); font-weight:600; }
  .wrap { max-width: 1200px; margin: 18px auto; padding: 0 14px; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; }
  .tabs button { padding:6px 14px; border:1px solid var(--border); background:var(--surface); color:var(--text-muted); border-radius:6px; cursor:pointer; font-size:13px; }
  .tabs button.active { background:var(--brand); color:#fff; border-color:var(--brand); }
  .toolbar { display:flex; gap:8px; margin-bottom:10px; }
  .toolbar .danger { color:#c33; padding:6px 12px; border:1px solid var(--border); background:var(--surface); border-radius:6px; cursor:pointer; font-size:13px; }
  table { width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden; }
  th, td { padding:10px 12px; text-align:left; font-size:13px; border-bottom:1px solid var(--border); vertical-align:top; }
  th { background:var(--surface-2); color:var(--text-muted); font-weight:600; font-size:12.5px; }
  tr:last-child td { border-bottom:0; }
  .empty { text-align:center; padding:30px; color:var(--text-muted); }
  .ops button, .ops a { margin-right:4px; padding:4px 10px; border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:4px; cursor:pointer; font-size:12px; text-decoration:none; display:inline-block; }
  .path { font-size:11.5px; color:var(--text-muted); font-family:ui-monospace,SFMono-Regular,monospace; word-break:break-all; }
</style>
</head>
<body>
<nav class="topnav">
  <a href="/console/index.html" data-i18n="nav.home">首页</a>
  <a href="/console/parse.html" data-i18n="nav.parse">解析</a>
  <a href="/console/downloads.html" data-i18n="nav.downloads">下载任务</a>
  <a href="/console/settings.html" data-i18n="nav.settings">设置</a>
  <a href="/console/account.html" data-i18n="nav.account">B 站账号</a>
  <a href="/console/favorites.html" data-i18n="nav.favorites" data-nav-role="bili">收藏夹</a>
  <a href="/console/history.html" class="active" data-i18n="nav.history" data-nav-role="bili">历史记录</a>
</nav>
<main class="wrap">
  <div class="tabs">
    <button id="tab-dl" class="active" data-i18n="history.tab.download">下载历史</button>
    <button id="tab-ps" data-i18n="history.tab.parse">解析历史</button>
  </div>
  <div class="toolbar">
    <span style="flex:1;color:var(--text-muted);font-size:12.5px;align-self:center;" id="counter"></span>
    <button id="clear" class="danger" data-i18n="history.clear">清空</button>
  </div>
  <div id="content"></div>
</main>
<script type="module" src="/console/js/history.js"></script>
</body>
</html>
