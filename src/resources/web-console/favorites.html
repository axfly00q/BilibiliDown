<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>收藏夹 · BilibiliDown</title>
<link href="/console/css/style.css" rel="stylesheet">
<style>
  .topnav { display:flex; gap:12px; padding:10px 18px; border-bottom:1px solid var(--border); background:var(--surface); }
  .topnav a { text-decoration:none; color:var(--text-muted); font-size:13.5px; }
  .topnav a.active { color:var(--brand); font-weight:600; }
  .wrap { max-width: 1200px; margin: 18px auto; padding: 0 14px; }
  .layout { display:grid; grid-template-columns: 280px 1fr; gap:14px; }
  .panel { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:12px; }
  .folder-list { list-style:none; margin:0; padding:0; max-height:600px; overflow:auto; }
  .folder-list li { padding:8px 10px; border-radius:6px; cursor:pointer; font-size:13px; display:flex; justify-content:space-between; align-items:center; }
  .folder-list li:hover { background:var(--surface-2); }
  .folder-list li.active { background:var(--brand-soft); color:var(--brand); font-weight:600; }
  .folder-list li .cnt { color:var(--text-muted); font-size:11.5px; }
  .toolbar { display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
  .toolbar select, .toolbar button { padding:6px 12px; border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:6px; font-size:13px; cursor:pointer; }
  .toolbar .primary { background:var(--brand); color:#fff; border-color:var(--brand); }
  .item-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:10px; }
  .item { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface-2); display:flex; flex-direction:column; cursor:pointer; transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease; text-decoration:none; color:inherit; }
  .item:hover { transform:translateY(-2px); box-shadow:var(--shadow-md); border-color:var(--brand); }
  .item img { width:100%; height:120px; object-fit:cover; background:#222; }
  .item .body { padding:8px; font-size:12.5px; display:flex; flex-direction:column; gap:4px; }
  .item .title { font-weight:600; color:var(--text); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:34px; }
  .item .meta { color:var(--text-muted); font-size:11.5px; }
  .empty, .notice { text-align:center; padding:40px 20px; color:var(--text-muted); }
  .notice a { color:var(--brand); text-decoration:none; }
  .pager { display:flex; gap:6px; justify-content:center; align-items:center; margin-top:12px; flex-wrap:wrap; }
  .pager button { padding:5px 10px; min-width:32px; border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:6px; cursor:pointer; font-size:12.5px; }
  .pager button:hover:not(:disabled) { background:var(--surface-2); }
  .pager button.active { background:var(--brand); color:#fff; border-color:var(--brand); }
  .pager button:disabled { opacity:.45; cursor:not-allowed; }
  .pager .info { font-size:12px; color:var(--text-muted); margin:0 6px; }
</style>
</head>
<body>
<nav class="topnav">
  <a href="/console/index.html" data-i18n="nav.home">首页</a>
  <a href="/console/parse.html" data-i18n="nav.parse">解析</a>
  <a href="/console/downloads.html" data-i18n="nav.downloads">下载任务</a>
  <a href="/console/logs.html" data-i18n="nav.logs">日志</a>
  <a href="/console/settings.html" data-i18n="nav.settings">设置</a>
  <a href="/console/account.html" data-i18n="nav.account">B 站账号</a>
  <a href="/console/favorites.html" class="active" data-i18n="nav.favorites" data-nav-role="bili">收藏夹</a>
  <a href="/console/history.html" data-i18n="nav.history" data-nav-role="bili">历史记录</a>
</nav>
<main class="wrap">
  <div id="auth-warn"></div>
  <div class="layout" id="main" hidden>
    <aside class="panel">
      <h3 style="margin:0 0 10px;font-size:14px;">我的收藏夹</h3>
      <ul id="folders" class="folder-list"></ul>
    </aside>
    <section class="panel">
      <div class="toolbar">
        <span id="title" style="flex:1;font-weight:600;">请选择左侧收藏夹</span>
        <label style="font-size:12.5px;color:var(--text-muted);">清晰度
          <select id="qn">
            <option value="120">4K (120)</option>
            <option value="116">1080P60 (116)</option>
            <option value="112">1080P+ (112)</option>
            <option value="80" selected>1080P (80)</option>
            <option value="64">720P (64)</option>
            <option value="32">480P (32)</option>
            <option value="16">360P (16)</option>
          </select>
        </label>
        <button id="submit-all" class="primary" disabled>下载整个收藏夹</button>
      </div>
      <div id="items" class="item-grid"><div class="empty">请从左侧选择一个收藏夹</div></div>
      <div id="pager" class="pager" hidden></div>
    </section>
  </div>
</main>
<script type="module" src="/console/js/favorites.js"></script>
</body>
</html>
