<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下载任务 · BilibiliDown</title>
<link href="/console/css/style.css" rel="stylesheet">
<style>
  .topnav { display:flex; gap:12px; padding:10px 18px; border-bottom:1px solid var(--border); background:var(--surface); }
  .topnav a { text-decoration:none; color:var(--text-muted); font-size:13.5px; }
  .topnav a.active { color:var(--brand); font-weight:600; }
  .wrap { max-width: 1200px; margin: 18px auto; padding: 0 14px; }
  .toolbar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .toolbar button { padding:8px 14px; border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:6px; cursor:pointer; font-size:13px; }
  .toolbar .danger { color:#c33; }
  table { width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden; }
  th, td { padding:10px 12px; text-align:left; font-size:13px; border-bottom:1px solid var(--border); }
  th { background: var(--surface-2); color: var(--text-muted); font-weight:600; font-size:12.5px; }
  tr:last-child td { border-bottom:0; }
  .progress { width:100%; height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden; }
  .progress > div { height:100%; background:var(--brand); transition:width .3s ease; }
  .ops button { margin-right:4px; padding:4px 10px; border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:4px; cursor:pointer; font-size:12px; }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11.5px; }
  .badge.active { background:#e6f7e6; color:#2a8a2a; }
  .badge.paused { background:#fff4d6; color:#a67500; }
  .badge.done { background:#e8f0ff; color:#2363c5; }
  .badge.fail { background:#ffe2e2; color:#c33; }
  .badge.queued, .badge.processing, .badge.none { background:#eee; color:#555; }
  body[data-theme="dark"] .badge.active { background:#143a14; color:#7fde7f; }
  body[data-theme="dark"] .badge.paused { background:#3a2c00; color:#f0c84a; }
  body[data-theme="dark"] .badge.done { background:#0e2750; color:#7fb0ff; }
  body[data-theme="dark"] .badge.fail { background:#3a1414; color:#ff8888; }
  .empty { text-align:center; padding:30px; color:var(--text-muted); }
</style>
</head>
<body>
<nav class="topnav">
  <a href="/console/index.html" data-i18n="nav.home">首页</a>
  <a href="/console/parse.html" data-i18n="nav.parse">解析</a>
  <a href="/console/downloads.html" class="active" data-i18n="nav.downloads">下载任务</a>
  <a href="/console/settings.html" data-i18n="nav.settings">设置</a>
  <a href="/console/account.html" data-i18n="nav.account">B 站账号</a>
  <a href="/console/favorites.html" data-i18n="nav.favorites" data-nav-role="bili">收藏夹</a>
  <a href="/console/history.html" data-i18n="nav.history" data-nav-role="bili">历史记录</a>
</nav>
<main class="wrap">
  <div id="dir-banner" style="margin-bottom:10px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12.5px;color:var(--text-muted);word-break:break-all;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
    <span data-i18n="downloads.saveDir">下载目录：</span><span id="save-dir" style="color:var(--text);font-family:ui-monospace,SFMono-Regular,monospace;flex:1;">-</span>
    <button id="open-save-dir" style="padding:4px 10px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:6px;cursor:pointer;font-size:12px;" data-i18n="downloads.openDir">打开目录</button>
  </div>
  <div class="toolbar">
    <button id="resume-all">全部继续</button>
    <button id="pause-all">全部暂停</button>
    <button id="remove-done" class="danger">清除已完成</button>
    <span style="flex:1"></span>
    <span id="status" style="color:var(--text-muted);font-size:12.5px;align-self:center"></span>
  </div>
  <table>
    <thead><tr>
      <th style="width:30%">名称</th>
      <th>状态</th>
      <th>进度</th>
      <th>大小</th>
      <th>速度</th>
      <th style="width:18%">操作</th>
    </tr></thead>
    <tbody id="tbody">
      <tr><td colspan="6" class="empty" id="empty">暂无任务</td></tr>
    </tbody>
  </table>
</main>
<script type="module" src="/console/js/downloads.js"></script>
</body>
</html>
