<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设置 · BilibiliDown</title>
<link href="/console/css/style.css" rel="stylesheet">
<style>
  .topnav { display:flex; gap:12px; padding:10px 18px; border-bottom:1px solid var(--border); background:var(--surface); }
  .topnav a { text-decoration:none; color:var(--text-muted); font-size:13.5px; }
  .topnav a.active { color:var(--brand); font-weight:600; }
  .wrap { max-width: 800px; margin: 18px auto; padding: 0 14px; }
  .toolbar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; align-items:center; }
  .toolbar button { padding:8px 14px; border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:6px; cursor:pointer; font-size:13px; }
  .toolbar .primary { background:var(--brand); color:#fff; border-color:var(--brand); }
  .toolbar button:disabled { opacity:.6; cursor:not-allowed; }
  .field-list { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:6px 0; }
  .field { display:grid; grid-template-columns: 280px 1fr; gap:18px; padding:12px 18px; border-bottom:1px solid var(--border); align-items:start; }
  .field:last-child { border-bottom:0; }
  .field .label { font-size:13px; color:var(--text); }
  .field .label .key { display:block; font-family: ui-monospace, SFMono-Regular, monospace; font-size:11.5px; color:var(--text-muted); margin-top:3px; word-break:break-all; }
  .field .ctl input, .field .ctl select { width:100%; box-sizing:border-box; padding:7px 10px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--bg); color:var(--text); font-size:13px; }
  .field .ctl input:focus, .field .ctl select:focus { outline:none; border-color:var(--brand); }
  .field .note { font-size:11.5px; color:var(--text-muted); margin-top:4px; }
  #status { font-size:12.5px; color:var(--text-muted); }
  .err { color:#e64; font-size:13px; margin:8px 0; min-height:18px; }
  .toast { position: fixed; right:18px; bottom:18px; padding:10px 14px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; box-shadow: var(--shadow-md); font-size:13px; opacity:0; transform: translateY(8px); transition: all .25s ease; }
  .toast.show { opacity:1; transform: translateY(0); }
  .ctl .browse-row { display:flex; gap:6px; }
  .ctl .browse-row input { flex:1; }
  .ctl .browse-row button { padding:6px 12px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); border-radius:var(--radius-sm); cursor:pointer; font-size:12.5px; white-space:nowrap; }
  .ctl .browse-row button:hover { background:var(--brand); color:#fff; border-color:var(--brand); }
  .ctl .resolved { font-size:11.5px; color:var(--text-muted); margin-top:4px; word-break:break-all; }

  .modal-mask { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:9999; }
  .modal-mask.show { display:flex; }
  .modal { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); width:560px; max-width:92vw; max-height:80vh; display:flex; flex-direction:column; box-shadow:var(--shadow-md); }
  .modal h3 { margin:0; padding:14px 18px; border-bottom:1px solid var(--border); font-size:15px; }
  .modal .body { padding:12px 18px; overflow:auto; flex:1; }
  .modal .footer { padding:10px 18px; border-top:1px solid var(--border); display:flex; gap:8px; justify-content:flex-end; }
  .modal .footer button { padding:6px 14px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); border-radius:var(--radius-sm); cursor:pointer; font-size:13px; }
  .modal .footer button.primary { background:var(--brand); color:#fff; border-color:var(--brand); }
  .modal .crumb { font-family: ui-monospace, SFMono-Regular, monospace; font-size:12.5px; color:var(--text-muted); padding:6px 10px; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); margin-bottom:8px; word-break:break-all; }
  .modal .row { display:flex; gap:6px; margin-bottom:8px; }
  .modal .row button { padding:5px 10px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); border-radius:var(--radius-sm); cursor:pointer; font-size:12.5px; }
  .modal .row select { flex:1; padding:5px 8px; border:1px solid var(--border); background:var(--bg); color:var(--text); border-radius:var(--radius-sm); font-size:12.5px; }
  .modal ul.dirs { list-style:none; margin:0; padding:0; border:1px solid var(--border); border-radius:var(--radius-sm); max-height:300px; overflow:auto; }
  .modal ul.dirs li { padding:8px 12px; cursor:pointer; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; font-size:13px; }
  .modal ul.dirs li:last-child { border-bottom:0; }
  .modal ul.dirs li:hover { background:var(--surface-2); }
  .modal ul.dirs li.empty { color:var(--text-muted); cursor:default; font-style:italic; }
  .modal .err { color:#e64; font-size:12px; min-height:16px; margin-top:6px; }
</style>
</head>
<body>
<nav class="topnav">
  <a href="/console/index.html" data-i18n="nav.home">首页</a>
  <a href="/console/parse.html" data-i18n="nav.parse">解析</a>
  <a href="/console/downloads.html" data-i18n="nav.downloads">下载任务</a>
  <a href="/console/dashboard.html" data-i18n="nav.dashboard">仪表盘</a>
  <a href="/console/logs.html" data-i18n="nav.logs">日志</a>
  <a href="/console/settings.html" class="active" data-i18n="nav.settings">设置</a>
  <a href="/console/account.html" data-i18n="nav.account">B 站账号</a>
  <a href="/console/favorites.html" data-i18n="nav.favorites" data-nav-role="bili">收藏夹</a>
  <a href="/console/history.html" data-i18n="nav.history" data-nav-role="bili">历史记录</a>
</nav>
<main class="wrap">
  <div class="toolbar">
    <button id="reload">重新读取</button>
    <button id="save" class="primary">保存修改</button>
    <span style="flex:1"></span>
    <span id="status"></span>
  </div>
  <div class="err" id="err"></div>
  <div id="form" class="field-list"><p class="note" style="padding:18px">加载中...</p></div>
</main>

<!-- 目录浏览模态框 -->
<div class="modal-mask" id="dir-modal">
  <div class="modal">
    <h3 data-i18n="settings.picker.title">选择下载保存目录</h3>
    <div class="body">
      <div class="crumb" id="dir-cwd">/</div>
      <div class="row">
        <button id="dir-up" data-i18n="settings.picker.up">↑ 上一级</button>
        <select id="dir-drive" title="切换盘符 / 根目录"></select>
        <button id="dir-mkdir" data-i18n="settings.picker.mkdir">+ 新建文件夹</button>
      </div>
      <ul class="dirs" id="dir-list"></ul>
      <div class="err" id="dir-err"></div>
    </div>
    <div class="footer">
      <button id="dir-cancel" data-i18n="common.cancel">取消</button>
      <button id="dir-ok" class="primary" data-i18n="settings.picker.choose">选择此目录</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script type="module" src="/console/js/settings.js"></script>
</body>
</html>
